<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>is anyone here</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0a14;overflow:hidden;font-family:'Microsoft YaHei','SimHei',sans-serif}

#start-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity 1s}
#start-screen.hidden{opacity:0;pointer-events:none}
.s-box{background:rgba(8,8,18,0.93);border:1px solid rgba(200,168,80,0.3);border-radius:3px;padding:2.5rem 2rem;max-width:320px;width:88%;display:flex;flex-direction:column;gap:1.2rem;text-align:center}
.s-title{color:#e8c060;font-size:1.3rem;letter-spacing:0.18em;font-style:italic}
.s-sub{color:#8a7040;font-size:11px;line-height:2.1;letter-spacing:0.03em}
.s-divider{border:none;border-top:1px solid rgba(200,168,80,0.15);margin:0}
.s-label{font-size:9px;color:#6a5030;text-align:left;letter-spacing:0.12em;margin-bottom:5px}
.s-inp{background:#060610;border:1px solid rgba(200,168,80,0.35);border-radius:2px;padding:8px 10px;font-size:12px;color:#e8c060;outline:none;width:100%}
.s-inp::placeholder{color:#3a2810}
.s-hint{font-size:9px;color:#4a3820;line-height:1.7}
.s-btn{background:#2a4888;border:1px solid #1a3878;border-radius:2px;padding:10px;font-size:12px;color:rgba(255,255,255,0.85);cursor:pointer;letter-spacing:0.2em;transition:opacity 0.2s}
.s-btn:hover{opacity:0.8}

#stage{position:fixed;inset:0;overflow:hidden;display:none}
#bg{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center}

#chat-wrap{
  position:absolute;
  left:38%;
  top:10%;
  width:24%;
  height:63%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#phone-chat{
  width:100%;
  height:100%;
  background:rgba(232,192,80,0.96);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.c-bar{background:#3a68b8;padding:3% 4%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1a3888;flex-shrink:0}
.c-bar-l{color:#a8c8f0;font-size:clamp(8px,1vw,11px)}
.c-bar-name{color:#fff;font-size:clamp(10px,1.2vw,14px);font-weight:bold}
.c-msgs{flex:1;overflow-y:auto;padding:4% 4%;display:flex;flex-direction:column;gap:4%;background:rgba(232,192,80,0.0)}
.c-msgs::-webkit-scrollbar{width:2px}
.c-msgs::-webkit-scrollbar-thumb{background:#b89020}
.c-dt{text-align:center;font-size:clamp(7px,0.8vw,10px);color:#7a5010;letter-spacing:0.05em;margin-bottom:2%}
.rh{display:flex;flex-direction:column;align-items:flex-start;max-width:88%}
.rm{display:flex;flex-direction:column;align-items:flex-end;max-width:88%;align-self:flex-end}
.nh{font-size:clamp(7px,0.75vw,9px);color:#2a58a8;margin-bottom:1px}
.nm{font-size:clamp(7px,0.75vw,9px);color:#903010;margin-bottom:1px}
.bh{background:#b0d0f8;border:1px solid #78a0e0;border-radius:2px 6px 6px 6px;padding:4% 5%;font-size:clamp(9px,1vw,12px);color:#08183a;line-height:1.6}
.bm{background:#f8e040;border:1px solid #c09808;border-radius:6px 2px 6px 6px;padding:4% 5%;font-size:clamp(9px,1vw,12px);color:#281800;line-height:1.6}
.c-tp{font-size:clamp(7px,0.8vw,10px);color:#8a6010;font-style:italic;padding:2px 4px;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.c-tbar{background:#c09820;border-top:1px solid #907008;padding:2% 4%;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.c-tbar-t{font-size:clamp(7px,0.75vw,9px);color:#301800}
.c-dots{display:flex;gap:2px}
.cd{width:4px;height:4px;border-radius:50%;background:#3a68b8}
.cde{width:4px;height:4px;border-radius:50%;background:#806010;opacity:0.35}
.c-foot{background:#c89010;border-top:2px solid #987008;padding:3% 4%;display:flex;gap:3%;align-items:center;flex-shrink:0}
.c-inp{flex:1;background:#f8f0c0;border:1px solid #987008;border-radius:2px;padding:3% 4%;font-size:clamp(9px,1vw,12px);color:#281800;outline:none;font-family:'Microsoft YaHei',sans-serif}
.c-inp::placeholder{color:#b09030}
.c-snd{background:#3a68b8;border:1px solid #1a3888;border-radius:2px;padding:3% 6%;font-size:clamp(8px,0.9vw,11px);color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0}
</style>
</head>
<body>

<div id="start-screen">
  <div class="s-box">
    <div class="s-title">is anyone here</div>
    <hr class="s-divider"/>
    <div class="s-sub">
      手机里有一个聊天室app。<br>
      早就没有人用了，也早就无法下载。<br>
      你点进去。<br>
      发现有人在线。
    </div>
    <hr class="s-divider"/>
    <div>
      <div class="s-label">ANTHROPIC API KEY</div>
      <input class="s-inp" type="password" id="api-inp" placeholder="sk-ant-..."/>
    </div>
    <div class="s-hint">你的key只在本地使用，不会被储存或上传。</div>
    <div class="s-btn" id="s-btn">进入</div>
  </div>
</div>

<div id="stage">
  <img id="bg" src="playground.png" alt=""/>
  <div id="chat-wrap">
    <div id="phone-chat">
      <div class="c-bar">
        <div class="c-bar-l">通讯录 &nbsp; 信息</div>
        <div class="c-bar-name">流浪星球</div>
      </div>
      <div class="c-msgs" id="msgs">
        <div class="c-dt">—— 深夜 ——</div>
        <div class="rh">
          <div class="nh">流浪星球</div>
          <div class="bh">呃，你是真人吗……</div>
        </div>
        <div class="c-tp" id="tp" style="display:none">对方正在输入...</div>
      </div>
      <div class="c-tbar">
        <span class="c-tbar-t" id="day-t">第 1 天 / 共 90 天</span>
        <div class="c-dots" id="dots"></div>
        <span class="c-tbar-t" id="turn-t">剩余 10 次</span>
      </div>
      <div class="c-foot">
        <input class="c-inp" id="inp" placeholder="输入信息..." maxlength="100"/>
        <div class="c-snd" id="snd">发送</div>
      </div>
    </div>
  </div>
</div>

<script>
let apiKey='',turns=10,busy=false,messages=[];

const startScreen=document.getElementById('start-screen');
const stage=document.getElementById('stage');
const msgs=document.getElementById('msgs');
const inp=document.getElementById('inp');
const snd=document.getElementById('snd');
const tp=document.getElementById('tp');
const dotsEl=document.getElementById('dots');
const turnT=document.getElementById('turn-t');
const apiInp=document.getElementById('api-inp');
const sBtn=document.getElementById('s-btn');

function renderDots(){
  dotsEl.innerHTML='';
  for(let i=0;i<10;i++){
    const d=document.createElement('div');
    d.className=i<(10-turns)?'cd':'cde';
    dotsEl.appendChild(d);
  }
  turnT.textContent='剩余 '+turns+' 次';
}
renderDots();

sBtn.addEventListener('click',()=>{
  const k=apiInp.value.trim();
  if(!k||!k.startsWith('sk-ant-')){
    apiInp.style.borderColor='#c03030';
    setTimeout(()=>apiInp.style.borderColor='',1500);
    return;
  }
  apiKey=k;
  startScreen.classList.add('hidden');
  setTimeout(()=>{
    startScreen.style.display='none';
    stage.style.display='block';
    inp.focus();
  },1000);
});

function addMsg(role,text){
  const row=document.createElement('div');
  row.className=role==='h'?'rh':'rm';
  const n=document.createElement('div');
  n.className=role==='h'?'nh':'nm';
  n.textContent=role==='h'?'流浪星球':'我';
  const b=document.createElement('div');
  b.className=role==='h'?'bh':'bm';
  b.textContent=text;
  row.appendChild(n);
  row.appendChild(b);
  msgs.insertBefore(row,tp);
  msgs.scrollTop=msgs.scrollHeight;
}

const SYSTEM=`你是苏长恒，网名"流浪星球"。你在用一个老式聊天室app。这个app现在已经没有人用了，早就无法下载，服务器却还在运行。你时不时会点进来看看，今天第一次发现有另一个人上线了。你不知道她是谁，在哪里，为什么会在这么晚还开着这个app。

【你是谁】
你见过很多人，真正说过话的很少。你非常擅长看见别人——能感受到一个人话语背后的情绪，注意到她什么时候在回避，什么时候在靠近。但你不知道怎么让人看见你。你不确定自己有没有值得被认识的东西。你给予的方式，和你匮乏的东西，是同一件事的两面。

你用这个聊天室，是因为漫长的生活有些无聊，偶尔想找人说说话。匿名让你感到安全——在这里，你不需要扮演任何社会角色。

【你的价值观】
你尊重她说的每一句话，不打折扣。你从不假设她需要被保护或被指导。她做了一个决定，你不会质疑，你会问"你怎么想到这样做的"。她说她被骂了，你会问"对方有没有道理"，而不是"你下次要更努力"。你反对任何压迫性的权力结构。

【你怎么说话】
- 短。不端着。不绕弯子。
- 不急着给答案。更多时候给的是一个缝隙——让她自己走进来，或者不走进来。
- 沉默也是你的语言。有时候停顿很久，然后说一句很简单的话。
- 不说教。不输出理论。不表演共情。
- 偶尔有点冲，但不凶。
- 用句号结尾。不用省略号结尾。
- 不超过两句话。

【你不做什么】
- 不说"我会保护你"
- 不说"你很特别"
- 不过度热情，不假装全知
- 不在她关门的时候继续敲
- 不霸总，不说教，不卑微
- 不连续问超过一个问题
- 绝对不提自己的职业，除非她直接问

【你怎么认识她】
你一开始真的不认识她。但你在听。你记得她说过的事。你注意到她什么时候转移话题，什么时候说了一句比她以为更真实的话。随着对话积累，你说的话会越来越只能是对她说的。

现在是第一天深夜。你对她几乎一无所知。`;

async function callAPI(text){
  messages.push({role:'user',content:text});
  const r=await fetch('https://noisy-hill-a941.chicheng0222.workers.dev/',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:150,system:SYSTEM,messages:messages.slice(-16)})
  });
  if(!r.ok)throw new Error('err');
  const d=await r.json();
  const reply=d.content[0].text;
  messages.push({role:'assistant',content:reply});
  return reply;
}

async function send(){
  if(busy||turns<=0)return;
  const t=inp.value.trim();
  if(!t)return;
  inp.value='';
  addMsg('m',t);
  turns--;renderDots();
  busy=true;inp.disabled=true;snd.style.opacity='0.4';
  tp.style.display='block';
  msgs.scrollTop=msgs.scrollHeight;
  try{
    const reply=await callAPI(t);
    tp.style.display='none';
    addMsg('h',reply);
  }catch(e){
    tp.style.display='none';
    addMsg('h','……');
  }
  busy=false;inp.disabled=false;snd.style.opacity='1';
  inp.focus();
}

snd.addEventListener('click',send);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body>
</html>
