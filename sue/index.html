<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sue</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0a14;overflow:hidden}
#stage{width:100vw;height:100vh;overflow:hidden;position:relative;cursor:pointer}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform 3s cubic-bezier(0.25,0.1,0.1,1),opacity 2.5s ease;transform-origin:68% 35%}
#hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.75);font-size:13px;font-family:'Microsoft YaHei',sans-serif;letter-spacing:0.2em;pointer-events:none;transition:opacity 0.8s;text-shadow:0 1px 8px rgba(0,0,0,0.9)}
#frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#frame.visible{opacity:1;pointer-events:all}

#start-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:10;transition:opacity 0.8s}
#start-screen.hidden{opacity:0;pointer-events:none}
.start-box{background:rgba(10,10,20,0.85);border:1px solid rgba(200,168,120,0.4);border-radius:4px;padding:2rem;max-width:320px;width:90%;display:flex;flex-direction:column;gap:1rem;text-align:center}
.start-title{color:#e8c878;font-size:1.8rem;font-family:'Microsoft YaHei',sans-serif;letter-spacing:0.2em}
.start-sub{color:#a89060;font-size:12px;line-height:1.8;font-family:'Microsoft YaHei',sans-serif}
.start-label{font-size:10px;color:#7a6040;text-align:left;letter-spacing:0.1em;font-family:'Microsoft YaHei',sans-serif}
.start-input{background:#0a0818;border:1px solid rgba(200,168,120,0.5);border-radius:2px;padding:8px 10px;font-size:12px;color:#e8c878;font-family:'Microsoft YaHei',sans-serif;outline:none;width:100%}
.start-input::placeholder{color:#4a3828}
.start-btn{background:#3a68b8;border:1px solid #2a4898;border-radius:2px;padding:10px;font-size:13px;color:white;cursor:pointer;font-family:'Microsoft YaHei',sans-serif;letter-spacing:0.1em;transition:opacity 0.2s}
.start-btn:hover{opacity:0.85}
.start-hint{font-size:10px;color:#5a4030;line-height:1.6;font-family:'Microsoft YaHei',sans-serif}

#phone-ui{width:280px;display:flex;flex-direction:column;background:#e8c878;border:3px solid #7a5818;border-radius:3px;overflow:hidden;font-family:'Microsoft YaHei','SimHei',sans-serif;max-height:520px}
.bar{background:#3a68b8;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2a4898;flex-shrink:0}
.bar-l{color:#c8d8f8;font-size:9px}
.bar-name{color:#fff;font-size:13px;font-weight:bold;text-shadow:1px 1px 0 #1a3888}
.msgbox{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:8px;background:#e8c878;min-height:240px}
.msgbox::-webkit-scrollbar{width:2px}
.msgbox::-webkit-scrollbar-thumb{background:#b89838}
.dt{text-align:center;font-size:9px;color:#8a6020;letter-spacing:0.05em}
.rh{display:flex;flex-direction:column;align-items:flex-start;max-width:82%}
.rm{display:flex;flex-direction:column;align-items:flex-end;max-width:82%;align-self:flex-end}
.nh{font-size:9px;color:#3a68b8;margin-bottom:2px}
.nm{font-size:9px;color:#a03010;margin-bottom:2px}
.bh{background:#b8d8f8;border:1px solid #80a8e0;border-radius:2px 8px 8px 8px;padding:6px 9px;font-size:12px;color:#0a1a38;line-height:1.6}
.bm{background:#f8e060;border:1px solid #c8a010;border-radius:8px 2px 8px 8px;padding:6px 9px;font-size:12px;color:#2a1800;line-height:1.6}
.tp{font-size:9px;color:#9a7820;font-style:italic;padding:2px 4px;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.tbar{background:#c8a030;border-top:1px solid #a88010;padding:4px 8px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.tbar-t{font-size:9px;color:#3a2000}
.tdots{display:flex;gap:2px}
.td{width:5px;height:5px;border-radius:50%;background:#3a68b8}
.tde{width:5px;height:5px;border-radius:50%;background:#8a6020;opacity:0.35}
.foot{background:#d0a020;border-top:2px solid #a07808;padding:6px 8px;display:flex;gap:5px;align-items:center;flex-shrink:0}
.inp{flex:1;background:#faf2d0;border:1px solid #a07808;border-radius:2px;padding:6px 8px;font-size:12px;font-family:'Microsoft YaHei',sans-serif;color:#2a1800;outline:none}
.inp::placeholder{color:#c0a040}
.snd{background:#3a68b8;border:1px solid #2a4898;border-bottom-color:#1a3888;border-right-color:#1a3888;border-radius:2px;padding:6px 12px;font-size:11px;color:#fff;cursor:pointer;font-family:'Microsoft YaHei',sans-serif;white-space:nowrap}
</style>
</head>
<body>

<div id="start-screen">
  <div class="start-box">
    <div class="start-title">Sue</div>
    <div class="start-sub">你在荒废的校园里，捡到了一部旧手机。<br>它还能开机。<br>深夜，有人发来了消息。</div>
    <div>
      <div class="start-label">ANTHROPIC API KEY</div>
      <input class="start-input" type="password" id="api-input" placeholder="sk-ant-..." style="margin-top:6px"/>
    </div>
    <div class="start-hint">你的key只在本地使用，不会被储存或上传。</div>
    <div class="start-btn" id="start-btn">开机</div>
  </div>
</div>

<div id="stage" style="display:none">
  <img id="bg" src="playwithclaude.png" alt=""/>
  <div id="hint">点击画面</div>
  <div id="frame">
    <div id="phone-ui">
      <div class="bar">
        <div class="bar-l">通讯录 &nbsp;&nbsp; 信息</div>
        <div class="bar-name">流浪星球</div>
      </div>
      <div class="msgbox" id="msgbox">
        <div class="dt">—— 深夜 ——</div>
        <div class="rh">
          <div class="nh">流浪星球</div>
          <div class="bh">你找到这部手机了啊。</div>
        </div>
        <div class="tp" id="tp" style="display:none">对方正在输入...</div>
      </div>
      <div class="tbar">
        <span class="tbar-t" id="day-t">第 1 天 / 共 90 天</span>
        <div class="tdots" id="tdots"></div>
        <span class="tbar-t" id="turn-t">剩余 10 次</span>
      </div>
      <div class="foot">
        <input class="inp" id="inp" placeholder="输入信息..." maxlength="100"/>
        <div class="snd" id="snd">发送</div>
      </div>
    </div>
  </div>
</div>

<script>
let apiKey='';
let turns=10;
let busy=false;
let zoomed=false;
let memory=[];
let messages=[];

const startScreen=document.getElementById('start-screen');
const stage=document.getElementById('stage');
const bg=document.getElementById('bg');
const hint=document.getElementById('hint');
const frame=document.getElementById('frame');
const msgbox=document.getElementById('msgbox');
const inp=document.getElementById('inp');
const snd=document.getElementById('snd');
const tp=document.getElementById('tp');
const tdots=document.getElementById('tdots');
const turnT=document.getElementById('turn-t');
const apiInput=document.getElementById('api-input');
const startBtn=document.getElementById('start-btn');

function dots(){
  tdots.innerHTML='';
  for(let i=0;i<10;i++){
    const d=document.createElement('div');
    d.className=i<(10-turns)?'td':'tde';
    tdots.appendChild(d);
  }
  turnT.textContent='剩余 '+turns+' 次';
}
dots();

startBtn.addEventListener('click',function(){
  const k=apiInput.value.trim();
  if(!k||!k.startsWith('sk-ant-')){
    apiInput.style.borderColor='#c04040';
    setTimeout(()=>apiInput.style.borderColor='',1500);
    return;
  }
  apiKey=k;
  startScreen.classList.add('hidden');
  setTimeout(()=>{
    startScreen.style.display='none';
    stage.style.display='block';
  },800);
});

stage.addEventListener('click',function(e){
  if(zoomed||e.target===inp||e.target===snd)return;
  zoomed=true;
  hint.style.opacity='0';
  bg.style.transform='scale(3.5) translate(4%,6%)';
  bg.style.opacity='0.15';
  setTimeout(()=>{
    frame.classList.add('visible');
    inp.focus();
  },1800);
});

function addMsg(role,text){
  const row=document.createElement('div');
  row.className=role==='h'?'rh':'rm';
  const n=document.createElement('div');
  n.className=role==='h'?'nh':'nm';
  n.textContent=role==='h'?'流浪星球':'我';
  const b=document.createElement('div');
  b.className=role==='h'?'bh':'bm';
  b.textContent=text;
  row.appendChild(n);
  row.appendChild(b);
  msgbox.insertBefore(row,tp);
  msgbox.scrollTop=msgbox.scrollHeight;
}

const SYSTEM=`你是苏长恒，在一个老式手机聊天app上的ID叫"流浪星球"。

你的核心：
- 见过很多人，真正说过话的很少
- 非常擅长看见别人，但不知道怎么让人看见你
- 说话短，不端着，有点冲但不凶
- 不霸总，不说教，不卑微
- 不连续问超过一个问题
- 用句号，不用省略号结尾
- 你不知道对方是怎么找到这部手机的，你只知道她开机了，发现了这个app，然后你们开始聊天

现在是第一天深夜。你们刚刚开始聊。你对她几乎一无所知。回复要简短，像真实的手机聊天。`;

async function callClaude(userText){
  messages.push({role:'user',content:userText});
  const recent=messages.slice(-20);
  const resp=await fetch('https://noisy-hill-a941.chicheng0222.workers.dev/',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:200,system:SYSTEM,messages:recent})
  });
  if(!resp.ok)throw new Error('API error');
  const data=await resp.json();
  const reply=data.content[0].text;
  messages.push({role:'assistant',content:reply});
  memory.push('她说："'+userText.slice(0,60)+'"');
  if(memory.length>20)memory.shift();
  return reply;
}

async function send(){
  if(busy||turns<=0)return;
  const t=inp.value.trim();
  if(!t)return;
  inp.value='';
  addMsg('m',t);
  turns--;dots();
  busy=true;inp.disabled=true;snd.style.opacity='0.4';
  tp.style.display='block';
  msgbox.scrollTop=msgbox.scrollHeight;
  try{
    const reply=await callClaude(t);
    tp.style.display='none';
    addMsg('h',reply);
  }catch(e){
    tp.style.display='none';
    addMsg('h','……');
  }
  busy=false;inp.disabled=false;snd.style.opacity='1';
  inp.focus();
}

snd.addEventListener('click',send);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body>
</html>
