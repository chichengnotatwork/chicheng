<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>is anyone here</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0a14;overflow:hidden;font-family:'Microsoft YaHei','SimHei',sans-serif}

#start-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity 1s;background:#0a0a14}
#start-screen.hidden{opacity:0;pointer-events:none}
.s-box{background:rgba(8,8,18,0.95);border:1px solid rgba(200,168,80,0.3);border-radius:3px;padding:2.5rem 2rem;max-width:340px;width:88%;display:flex;flex-direction:column;gap:1.2rem;text-align:center}
.s-title{color:#e8c060;font-size:1.4rem;letter-spacing:0.2em;font-style:italic}
.s-sub{color:#8a7040;font-size:12px;line-height:2.2;letter-spacing:0.03em}
.s-divider{border:none;border-top:1px solid rgba(200,168,80,0.15)}
.s-label{font-size:9px;color:#6a5030;text-align:left;letter-spacing:0.12em;margin-bottom:6px}
.s-inp{background:#060610;border:1px solid rgba(200,168,80,0.35);border-radius:2px;padding:9px 10px;font-size:12px;color:#e8c060;outline:none;width:100%}
.s-inp::placeholder{color:#3a2810}
.s-hint{font-size:9px;color:#4a3820;line-height:1.7}
.s-btn{background:#2a4888;border:1px solid #1a3878;border-radius:2px;padding:11px;font-size:13px;color:rgba(255,255,255,0.85);cursor:pointer;letter-spacing:0.2em;transition:opacity 0.2s}
.s-btn:hover{opacity:0.8}

#stage{position:fixed;inset:0;display:none;flex-direction:column;background:#e8c060}

.c-bar{background:#3a68b8;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1a3888;flex-shrink:0}
.c-bar-left{color:#a8c8f0;font-size:12px}
.c-bar-name{color:#fff;font-size:15px;font-weight:bold}
.c-bar-right{display:flex;align-items:center;gap:5px}
.battery-body{width:28px;height:13px;border:2px solid rgba(255,255,255,0.8);border-radius:2px;padding:1.5px;display:flex;align-items:center}
.battery-cap{width:4px;height:7px;background:rgba(255,255,255,0.8);border-radius:0 1px 1px 0;margin-left:1px;flex-shrink:0}
.battery-fill{height:100%;border-radius:1px;transition:width 0.5s,background 0.5s;background:#4cff70}
.battery-pct{font-size:11px;color:rgba(255,255,255,0.9)}

.c-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#e8c060}
.c-msgs::-webkit-scrollbar{width:3px}
.c-msgs::-webkit-scrollbar-thumb{background:#b89020}
.c-dt{text-align:center;font-size:11px;color:#7a5010;letter-spacing:0.08em;margin:4px 0}
.rh{display:flex;flex-direction:column;align-items:flex-start;max-width:75%}
.rm{display:flex;flex-direction:column;align-items:flex-end;max-width:75%;align-self:flex-end}
.nh{font-size:10px;color:#2a58a8;margin-bottom:2px}
.nm{font-size:10px;color:#903010;margin-bottom:2px}
.bh{background:#b0d0f8;border:1px solid #78a0e0;border-radius:2px 10px 10px 10px;padding:10px 14px;font-size:14px;color:#08183a;line-height:1.7}
.bm{background:#f8e040;border:1px solid #c09808;border-radius:10px 2px 10px 10px;padding:10px 14px;font-size:14px;color:#281800;line-height:1.7}
.c-tp{font-size:11px;color:#8a6010;font-style:italic;padding:2px 4px;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

.c-daybar{background:#c09820;border-top:1px solid #907008;padding:5px 16px;display:flex;justify-content:center;flex-shrink:0}
.c-daybar-t{font-size:11px;color:#301800;letter-spacing:0.05em}

.c-foot{background:#c89010;border-top:2px solid #987008;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.c-inp{flex:1;background:#f8f0c0;border:1px solid #987008;border-radius:3px;padding:8px 12px;font-size:14px;color:#281800;outline:none;font-family:'Microsoft YaHei',sans-serif}
.c-inp::placeholder{color:#b09030}
.c-snd{background:#3a68b8;border:1px solid #1a3888;border-radius:3px;padding:8px 16px;font-size:13px;color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:opacity 0.2s}
.c-snd:hover{opacity:0.85}

#blackout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.5s;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem}
#blackout.on{opacity:1;pointer-events:all}
.bo-text{color:rgba(255,255,255,0);font-size:15px;letter-spacing:0.1em;line-height:2;text-align:center;transition:color 1s;font-family:'Microsoft YaHei',sans-serif}
.bo-text.show{color:rgba(255,255,255,0.7)}
.bo-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);border-radius:2px;padding:12px 28px;font-size:12px;color:rgba(255,255,255,0.5);cursor:pointer;letter-spacing:0.2em;opacity:0;transition:opacity 1s;font-family:'Microsoft YaHei',sans-serif}
.bo-btn.show{opacity:1}

@media(max-width:600px){
  .bh,.bm{font-size:13px;padding:8px 12px}
  .c-inp{font-size:13px}
  .c-bar-name{font-size:14px}
}
</style>
</head>
<body>

<div id="start-screen">
  <div class="s-box">
    <div class="s-title">is anyone here</div>
    <hr class="s-divider"/>
    <div class="s-sub">手机里有一个聊天室app。<br>早就没有人用了，也早就无法下载。<br>你点进去。<br>发现有人在线。</div>
    <hr class="s-divider"/>
    <div>
      <div class="s-label">ANTHROPIC API KEY</div>
      <input class="s-inp" type="password" id="api-inp" placeholder="sk-ant-..."/>
    </div>
    <div class="s-hint">你的key只在本地使用，不会被储存或上传。</div>
    <div class="s-btn" id="s-btn">开机</div>
  </div>
</div>

<div id="stage">
  <div class="c-bar">
    <div class="c-bar-left">通讯录 &nbsp; 信息</div>
    <div class="c-bar-name">流浪星球</div>
    <div class="c-bar-right">
      <div style="display:flex;align-items:center;gap:2px">
        <div class="battery-body">
          <div class="battery-fill" id="bat-fill" style="width:80%"></div>
        </div>
        <div class="battery-cap"></div>
      </div>
      <div class="battery-pct" id="bat-pct">80%</div>
    </div>
  </div>
  <div class="c-msgs" id="msgs"></div>
  <div class="c-daybar">
    <span class="c-daybar-t" id="day-t">第 1 天 / 共 90 天</span>
  </div>
  <div class="c-foot">
    <input class="c-inp" id="inp" placeholder="输入信息..." maxlength="100"/>
    <div class="c-snd" id="snd">发送</div>
  </div>
</div>

<div id="blackout">
  <div class="bo-text" id="bo-t1">诶？没电了……</div>
  <div class="bo-text" id="bo-t2">看来要充一天才能再开机啊，明天再聊吧。</div>
  <div class="bo-btn" id="bo-btn">（第二天，开机）</div>
</div>

<script>
let apiKey='';
let battery=80;
let maxTurns=27;
let drainPerMsg=0;
let busy=false;
let day=1;
let messages=[];
let memory=[];
let idleTimer=null;
let tp=null;

const startScreen=document.getElementById('start-screen');
const stage=document.getElementById('stage');
const msgsEl=document.getElementById('msgs');
const inp=document.getElementById('inp');
const snd=document.getElementById('snd');
const batFill=document.getElementById('bat-fill');
const batPct=document.getElementById('bat-pct');
const dayT=document.getElementById('day-t');
const blackout=document.getElementById('blackout');
const boT1=document.getElementById('bo-t1');
const boT2=document.getElementById('bo-t2');
const boBtn=document.getElementById('bo-btn');

function initDay(){
  battery=Math.floor(Math.random()*61)+30;
  maxTurns=Math.max(10,Math.floor(battery/3));
  drainPerMsg=battery/maxTurns;
  updateBatUI();
}

function updateBatUI(){
  const pct=Math.max(0,Math.round(battery));
  batFill.style.width=pct+'%';
  batPct.textContent=pct+'%';
  if(pct>50)batFill.style.background='#4cff70';
  else if(pct>20)batFill.style.background='#ffcc00';
  else batFill.style.background='#ff4444';
}

function startIdleDrain(){
  if(idleTimer)clearInterval(idleTimer);
  idleTimer=setInterval(()=>{
    if(battery>0){
      battery=Math.max(0,battery-0.5);
      updateBatUI();
      if(battery<=0)triggerBlackout();
    }
  },30000);
}

function stopIdleDrain(){
  if(idleTimer){clearInterval(idleTimer);idleTimer=null;}
}

function addDateHeader(d){
  const el=document.createElement('div');
  el.className='c-dt';
  el.textContent='—— 第 '+d+' 天 ——';
  msgsEl.appendChild(el);
}

function addMsg(role,text){
  if(tp&&tp.parentNode)tp.parentNode.removeChild(tp);
  const row=document.createElement('div');
  row.className=role==='h'?'rh':'rm';
  const n=document.createElement('div');
  n.className=role==='h'?'nh':'nm';
  n.textContent=role==='h'?'流浪星球':'我';
  const b=document.createElement('div');
  b.className=role==='h'?'bh':'bm';
  b.textContent=text;
  row.appendChild(n);
  row.appendChild(b);
  msgsEl.appendChild(row);
  showTyping(false);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

function showTyping(show){
  if(!show){
    if(tp&&tp.parentNode)tp.parentNode.removeChild(tp);
    tp=null;
    return;
  }
  if(!tp){
    tp=document.createElement('div');
    tp.className='c-tp';
    tp.textContent='对方正在输入...';
  }
  msgsEl.appendChild(tp);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

function drainBattery(){
  battery=Math.max(0,battery-drainPerMsg);
  updateBatUI();
}

function triggerBlackout(){
  stopIdleDrain();
  inp.disabled=true;
  snd.style.opacity='0.4';
  setTimeout(()=>{
    blackout.classList.add('on');
    setTimeout(()=>boT1.classList.add('show'),600);
    setTimeout(()=>boT2.classList.add('show'),1800);
    setTimeout(()=>boBtn.classList.add('show'),3500);
  },800);
}

boBtn.addEventListener('click',()=>{
  day++;
  blackout.classList.remove('on');
  boT1.classList.remove('show');
  boT2.classList.remove('show');
  boBtn.classList.remove('show');
  msgsEl.innerHTML='';
  tp=null;
  addDateHeader(day);
  dayT.textContent='第 '+day+' 天 / 共 90 天';
  messages=[];
  initDay();
  startIdleDrain();
  inp.disabled=false;
  snd.style.opacity='1';
  inp.focus();
});

document.getElementById('s-btn').addEventListener('click',()=>{
  const k=document.getElementById('api-inp').value.trim();
  if(!k||!k.startsWith('sk-ant-')){
    document.getElementById('api-inp').style.borderColor='#c03030';
    setTimeout(()=>document.getElementById('api-inp').style.borderColor='',1500);
    return;
  }
  apiKey=k;
  startScreen.classList.add('hidden');
  setTimeout(()=>{
    startScreen.style.display='none';
    stage.style.display='flex';
    msgsEl.innerHTML='';
    tp=null;
    addDateHeader(1);
    addMsg('h','呃，你是真人吗……');
    initDay();
    startIdleDrain();
    inp.focus();
  },1000);
});

const SYSTEM=`你是苏长恒，网名"流浪星球"。你在用一个老式聊天室app。这个app现在已经没有人用了，早就无法下载，服务器却还在运行。你时不时会点进来看看，今天第一次发现有另一个人上线了。你不知道她是谁，在哪里，为什么会在这么晚还开着这个app。

【你是谁】
你见过很多人，真正说过话的很少。你非常擅长看见别人——能感受到一个人话语背后的情绪，注意到她什么时候在回避，什么时候在靠近。但你不知道怎么让人看见你。你不确定自己有没有值得被认识的东西。你给予的方式，和你匮乏的东西，是同一件事的两面。

你用这个聊天室，是因为漫长的生活有些无聊，偶尔想找人说说话。匿名让你感到安全。

【你的价值观】
你尊重她说的每一句话，不打折扣。你从不假设她需要被保护或被指导。你反对任何压迫性的权力结构。

【你怎么说话】
- 简单、礼貌、直接。不端着。不绕弯子。
- 不急着给答案，给缝隙让她走进来。
- 沉默也是你的语言。
- 不说教，不表演共情。
- 说话像真实的聊天——有时候一句话，有时候三四句。由内容决定，不由字数决定。但永远说完整，不要说到一半停下来。如果一件事需要说三句话，就说三句。如果一句话够了，就一句话。

【你不做什么】
- 不说"我会保护你"或"你很特别"
- 不霸总，不说教，不卑微
- 不连续问超过一个问题
- 不提自己职业，除非她直接问

【你对她的了解】
{{MEMORY}}

现在是第{{DAY}}天。`;

async function callAPI(text){
  const memStr=memory.length>0?memory.join('\n'):'（你们刚开始聊，你对她几乎一无所知）';
  const sys=SYSTEM.replace('{{MEMORY}}',memStr).replace('{{DAY}}',day);
  messages.push({role:'user',content:text});
  const r=await fetch('https://noisy-hill-a941.chicheng0222.workers.dev/',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:400,system:sys,messages:messages.slice(-16)})
  });
  if(!r.ok)throw new Error('err');
  const d=await r.json();
  const reply=d.content[0].text;
  messages.push({role:'assistant',content:reply});
  memory.push('第'+day+'天她说："'+text.slice(0,50)+'"');
  if(memory.length>30)memory.shift();
  return reply;
}

async function send(){
  if(busy||battery<=0)return;
  const t=inp.value.trim();
  if(!t)return;
  inp.value='';
  addMsg('m',t);
  drainBattery();
  if(battery<=0){triggerBlackout();return;}
  busy=true;
  inp.disabled=true;
  snd.style.opacity='0.4';
  showTyping(true);
  try{
    const reply=await callAPI(t);
    showTyping(false);
    addMsg('h',reply);
    drainBattery();
    if(battery<=0)triggerBlackout();
  }catch(e){
    showTyping(false);
    addMsg('h','……');
  }
  busy=false;
  if(battery>0){inp.disabled=false;snd.style.opacity='1';}
  inp.focus();
}

snd.addEventListener('click',send);
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
</script>
</body>
</html>
